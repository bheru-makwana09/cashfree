<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orbit Pill</title>
<link rel="stylesheet" href="orbit-pill.css">
</head>
<body>

<div class="stage" id="stage">

  <div class="pill">
    <div class="slot slot-left">
      <img src="icons/logo.svg" alt="Brand" width="24" height="24">
    </div>
    <div class="slot slot-right"></div>
  </div>

  <!-- Orbit icons are static markup here, not generated by JS.
       data-angle is each icon's starting position in degrees
       (0 = right, 90 = down, measured from the orbit centre).
       180deg is where the pill's socket sits, so whichever icon's
       *current* angle is nearest 180 is drawn large and on top. -->
  <div id="orbit">
    <div class="orbit-item" data-angle="180">
      <img src="icons/android.svg" alt="Android" width="24" height="24">
    </div>
    <div class="orbit-item" data-angle="120">
      <img src="icons/apple.svg" alt="Apple" width="24" height="24">
    </div>
    <div class="orbit-item" data-angle="60">
      <img src="icons/hex.svg" alt="Ionic" width="24" height="24">
    </div>
    <div class="orbit-item" data-angle="0">
      <img src="icons/react.svg" alt="React" width="24" height="24">
    </div>
    <div class="orbit-item" data-angle="300">
      <img src="icons/lines.svg" alt="Lines" width="24" height="24">
    </div>
    <div class="orbit-item" data-angle="240">
      <img src="icons/grid.svg" alt="Apps" width="24" height="24">
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="orbit-pill.js"></script>
<script>
  initOrbitPill();
</script>
</body>
</html>
